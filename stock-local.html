<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://qt.gtimg.cn https://web.sqt.gtimg.cn; base-uri 'none'; form-action 'none'">
<title>ELINK 本地股票页</title>
<style>
  body { max-width: 680px; margin: 32px auto; padding: 0 16px; color: #271c15; background: #faf7f2; font: 16px/1.6 system-ui, sans-serif; }
  h1 { font-size: 26px; }
  label { display: block; }
  textarea { box-sizing: border-box; width: 100%; margin: 4px 0 12px; }
  button, textarea { font: inherit; padding: 6px 10px; }
  a { color: #804828; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th, td { padding: 6px; border-bottom: 1px solid #ded6cd; text-align: left; }
  .quotes { overflow-x: auto; }
  .time { white-space: nowrap; }
</style>
</head>
<body>
<h1>ELINK 本地股票页</h1>
<p>连接网络后可刷新腾讯行情。导出行情文件，然后在控制台的「股票日历」导入并预览。</p>
<label for="codes">自选代码（最多 5 个，保留 sh、sz 或 bj 前缀）</label>
<textarea id="codes" rows="2">STOCK_DEFAULT_CODES</textarea>
<button id="refresh" type="button">刷新行情</button>
<button id="export" type="button" disabled>导出行情文件</button>
<p id="status" role="status">点击刷新获取最近行情。</p>
<div class="quotes">
<table id="quotes" hidden>
  <thead><tr><th>股票</th><th>价格</th><th>涨跌幅</th><th>行情时间（北京时间）</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<details id="manual">
  <summary>手动载入行情原文</summary>
  <p>打开腾讯行情，复制网页中显示的完整行情文本，再粘贴到下方。若链接也打不开，需要换到能访问该行情域名的网络。</p>
  <p><a id="primary" target="_blank" rel="noopener noreferrer">打开主通道</a> · <a id="backup" target="_blank" rel="noopener noreferrer">打开备用通道</a></p>
  <label for="raw">行情原文</label>
  <textarea id="raw" rows="4" maxlength="32000"></textarea>
  <button id="read" type="button">读取粘贴的行情</button>
</details>
<!-- STOCK_LIBRARIES -->
<script>
"use strict";
(() => {
  const $ = id => document.getElementById(id);
  const codes = $("codes"), status = $("status"), refresh = $("refresh"), read = $("read");
  let snapshot;
  function updateLinks() {
    try {
      const [primary, backup] = OMFeatures.stockUrls(OMFeatures.stockSymbols(codes.value));
      $("primary").href = primary;
      $("backup").href = backup;
    } catch {
      $("primary").removeAttribute("href");
      $("backup").removeAttribute("href");
    }
  }
  function accept(text, symbols) {
    const {quotes} = OMFeatures.stockTencent(text, symbols);
    $("rows").replaceChildren(...quotes.map(quote => {
      const row = document.createElement("tr");
      for (const value of [`${quote.name} (${quote.symbol})`, quote.price?.toFixed(2) ?? "—", quote.changePercent == null ? "—" : `${quote.changePercent.toFixed(2)}%`, quote.time]) {
        const cell = row.insertCell();
        cell.textContent = value;
      }
      row.lastElementChild.className = "time";
      return row;
    }));
    snapshot = {format: "elink42-stock-v1", codes: symbols.join(","), text};
    $("quotes").hidden = false;
    $("export").disabled = false;
    status.textContent = "已取得行情，数据时间见表格。";
  }
  function failure(error) {
    status.textContent = (error.name === "TimeoutError" ? "行情请求超时。" : error.name === "TypeError" || error.name === "AbortError" ? "本地页无法读取行情。可尝试手动载入原文。" : error.message) + (snapshot ? " 已保留上次行情。" : "");
  }
  codes.addEventListener("input", updateLinks);
  updateLinks();
  refresh.addEventListener("click", async () => {
    refresh.disabled = read.disabled = codes.disabled = true;
    try {
      const symbols = OMFeatures.stockSymbols(codes.value);
      status.textContent = "正在获取行情…";
      const {response, bytes} = await OMFeatures.stockTransport(OMFeatures.stockUrls(symbols), () => {
        status.textContent = "正在尝试备用通道…";
        return true;
      });
      if (!response.ok) throw Error("行情服务返回 HTTP " + response.status);
      accept(OMFeatures.stockText(bytes), symbols);
    } catch (error) {
      failure(error);
      $("manual").open = true;
    } finally {
      refresh.disabled = read.disabled = codes.disabled = false;
    }
  });
  read.addEventListener("click", () => {
    try {
      // Copying the source from a browser can collapse line breaks into spaces.
      const text = $("raw").value.replace(/";\s*(?=v_(?:sh|sz|bj)\d{6}=")/g, '";\n');
      accept(text, OMFeatures.stockSymbols(codes.value));
    }
    catch (error) { failure(error); }
  });
  $("export").addEventListener("click", () => {
    if (!snapshot) return;
    const url = URL.createObjectURL(new Blob([JSON.stringify(snapshot)], {type: "application/json"}));
    const link = document.createElement("a");
    link.href = url;
    link.download = "elink42-stock-quotes.json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  });
})();
</script>
</body>
</html>
